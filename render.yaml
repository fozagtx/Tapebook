# Render Blueprint: deploys the Tapebook website (web/) as a Node web service.
# In Render: New → Blueprint → pick this repository; Render reads this file.
# The site imports contract ABIs and netlist code from contracts/, so it builds from the
# repository root rather than with rootDir: web.
services:
  - type: web
    name: tapebook-web
    runtime: node
    plan: free # change to starter or higher to avoid cold starts
    buildCommand: cd web && npm ci && npm run build
    startCommand: cd web && npm run start # next start listens on $PORT, which Render sets
    healthCheckPath: /
    autoDeploy: true
    buildFilter:
      paths:
        - web/**
        - contracts/core/**
        - contracts/abi/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Addresses from contracts/deployments/196.json after the mainnet deploy (scripts 01–04).
      # NEXT_PUBLIC_* values are baked in at build time: redeploy after changing them.
      - key: NEXT_PUBLIC_CLAIMS_ADDRESS
        sync: false
      - key: NEXT_PUBLIC_TAPEBOOK_CIRCUITS
        sync: false
      - key: NEXT_PUBLIC_TAPEBOOK_TRANSISTORS
        sync: false
      # Optional: block of the TapeOut factory deployment (bounds the upgrade-history log scan).
      - key: NEXT_PUBLIC_TAPEOUT_DEPLOY_BLOCK
        sync: false
      # Optional: WalletConnect project id for mobile wallets.
      - key: NEXT_PUBLIC_WC_PROJECT_ID
        sync: false
      # Optional: server-side RPC for /api/index and /api/versions (defaults to the public X Layer RPCs).
      - key: XLAYER_RPC_URL
        sync: false
