# Render Blueprint: deploys the Tapebook website (web/) as a Node web service.
# In Render: New → Blueprint → pick this repository; Render reads this file.
# The site imports contract ABIs and netlist code from contracts/, so it builds from the
# repository root rather than with rootDir: web.
services:
  - type: web
    name: tapebook-web
    runtime: node
    plan: free # change to starter or higher to avoid cold starts
    buildCommand: cd web && npm ci && npm run build
    startCommand: cd web && npm run start # next start listens on $PORT, which Render sets
    healthCheckPath: /
    autoDeploy: true
    buildFilter:
      paths:
        - web/**
        - contracts/core/**
        - contracts/abi/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # X Layer mainnet addresses (contracts/deployments/196.json). These are also the defaults in
      # web/lib/config.ts; NEXT_PUBLIC_* values are baked in at build time, so redeploy after changing them.
      - key: NEXT_PUBLIC_CLAIMS_ADDRESS
        value: "0xF225AEc83B2738b791b3CD76006e248814bE55F0"
      - key: NEXT_PUBLIC_TAPEBOOK_CIRCUITS
        value: "0x20CEC0Ca666B43e0CbCDBb50b0b6fdf6F2D7Dd13"
      - key: NEXT_PUBLIC_TAPEBOOK_TRANSISTORS
        value: "0x3F35dc7C698bAE36F32ae83bABAEce7e3BF2D039"
      # Block the TapeOut factory was deployed at; bounds the upgrade-history log scan at build time.
      - key: NEXT_PUBLIC_TAPEOUT_DEPLOY_BLOCK
        value: "70995047"
      # Optional, add in the Render dashboard if needed:
      #   NEXT_PUBLIC_WC_PROJECT_ID         WalletConnect project id for mobile wallets
      #   XLAYER_RPC_URL                    server-side RPC for /api/index and /api/versions (defaults to public X Layer RPCs)
