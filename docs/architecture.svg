<text x="443" y="371" font-size="15" font-weight="400" fill="#2d5653">wagmi: injected + WalletConnect, switch to X Layer</text>
<text x="443" y="394" font-size="15" font-weight="400" fill="#2d5653">every tx: preview → sign → pending → confirmed</text>
