<text x="443" y="513" font-size="15" font-weight="600" fill="#0b2626">/api/index  — Book snapshot at one block:</text>
<text x="443" y="536" font-size="15" font-weight="400" fill="#2d5653">every processor and circuit via Multicall3</text>
<text x="443" y="559" font-size="15" font-weight="600" fill="#0b2626">/api/versions  — TapeOut logic, seal flag, fees,</text>
<text x="443" y="582" font-size="15" font-weight="400" fill="#2d5653">conformance, upgrade history from logs</text>
<rect x="431" y="646" width="470" height="118" rx="10" fill="#008b8b"/>
<rect x="425" y="640" width="470" height="118" rx="10" fill="#b2ffff" stroke="#008b8b" stroke-width="3"/>
