<text x="1023" y="625" font-size="14" font-weight="400" fill="#2d5653">NAND supply 1,000,000 (the cap) · 0.0001 OKB each</text>
<rect x="1005" y="652" width="480" height="146" rx="10" fill="#b2ffff" stroke="#008b8b" stroke-width="3"/>
<text x="1023" y="684" font-size="17" font-weight="700" fill="#0b2626">Circuits</text>
<text x="1023" y="710" font-size="14" font-weight="600" fill="#0b2626">seed specs ADD8C · MAJ5 · EQ8 · MUX8</text>
<text x="1023" y="732" font-size="14" font-weight="400" fill="#2d5653">reference targets A, B · one miter per claim</text>
<text x="1023" y="754" font-size="14" font-weight="400" fill="#2d5653">miter = REF target + REF spec</text>
<text x="1023" y="776" font-size="14" font-weight="400" fill="#2d5653">→ XOR → OR → 1 bit</text>
