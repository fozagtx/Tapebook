<text x="1003" y="358" font-size="14" font-weight="600" fill="#0b2626">post · commit · challenge · topUp · reclaimBond · withdraw</text>
<text x="1003" y="380" font-size="14" font-weight="400" fill="#2d5653">differs · conformance · currentImpl (views)</text>
<text x="1003" y="402" font-size="14" font-weight="400" fill="#2d5653">bond ≤ 1 OKB · lock ≥ 1 day · miter ≤ 1,000 gates</text>
<text x="1003" y="424" font-size="14" font-weight="400" fill="#2d5653">no owner · no fee · not upgradeable · pull payments</text>
