<text x="443" y="698" font-size="15" font-weight="400" fill="#2d5653">differs(claimId, x) in Multicall3 batches of 256,</text>
<text x="443" y="721" font-size="15" font-weight="400" fill="#2d5653">≤ 20 batches/s, halved on RPC error</text>
<text x="443" y="744" font-size="15" font-weight="400" fill="#2d5653">full sweep when nIn ≤ 16</text>
